<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Attendance</title>
<link rel="stylesheet" href="/static/common.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>Attendance</h1>
    <select class="classsel" id="classSel" aria-label="Class"></select>
    <span class="grow"></span>
    <button class="btn sm" id="shareBtn">Share</button>
    <button class="btn sm" id="setBtn" aria-label="Class settings">⚙ Settings</button>
  </div>
  <nav class="tabs"><div class="wrap">
    <a class="tab" data-t="attend" href="#/">Attendance</a>
    <a class="tab" data-t="records" href="#/records">Records</a>
    <a class="tab" data-t="students" href="#/students">Students</a>
  </div></nav>
</header>
<main class="wrap" style="padding-top:16px;padding-bottom:60px"><div id="view"></div></main>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="login" id="login"><div class="card stack">
  <h1>Attendance</h1><p class="hint" style="margin:0">Teacher login</p>
  <input type="password" id="pw" placeholder="Password" autocomplete="current-password">
  <button class="btn primary" id="pwgo" style="width:100%">Sign in</button>
</div></div>
<div class="toast" id="toast"></div>
<script src="/static/matrix.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
